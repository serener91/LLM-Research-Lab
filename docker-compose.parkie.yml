services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: bash -lc "pip install uv && uv sync && uv run uvicorn src.parkie_system.app:app --host 0.0.0.0 --port 8080"
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: parkie
      POSTGRES_USER: parkie
      POSTGRES_PASSWORD: parkie
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
